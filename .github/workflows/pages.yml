name: Deploy lightweight DROPLET-RISK site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build compact browser data
        run: |
          python scripts/build_web_assets.py \
            --lookup data/lookup_records_unified.json \
            --summary DROPLET_RISK_unified_summary.json \
            --site site

      - name: Verify scoring and browser interactions offline
        run: |
          node tests/test_score.mjs
          node tests/test_app.mjs

      - name: Validate generated site
        run: python scripts/validate_web_build.py

      - name: Show deployment sizes
        run: |
          du -h site/data/lookup-16k.compact.json
          du -sh site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
